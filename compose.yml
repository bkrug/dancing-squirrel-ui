services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3626:3626"
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json
          target: /app/package.json

